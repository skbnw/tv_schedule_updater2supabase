<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>T-Clip — テレビ番組検索β</title>
  <meta name="description" content="地上波・BSの番組表と出演者を横断検索。国会ネクサスの姉妹アプリ。">
  <link rel="stylesheet" href="/styles.css?v=3">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/">
        <span class="brand-mark">T-Clip</span>
        <span class="brand-sub">テレビ番組検索β</span>
      </a>
      <a class="sister" href="https://kokkai-nexus-305630672228.asia-northeast1.run.app/" target="_blank" rel="noopener">
        国会ネクサス
      </a>
    </div>
    <nav class="tabs" aria-label="検索の種類">
      <button type="button" class="tab is-active" data-tab="programs">番組</button>
      <button type="button" class="tab" data-tab="talents">出演者</button>
      <button type="button" class="tab" data-tab="politicians">議員</button>
    </nav>
  </header>

  <main>
    <section id="panel-programs" class="panel">
      <form id="programForm" class="search-form">
        <label class="grow">
          <span>キーワード</span>
          <input type="search" id="q" placeholder="番組名・内容（空白区切りで AND）" autocomplete="off">
        </label>
        <label>
          <span>開始日</span>
          <input type="date" id="from">
        </label>
        <label>
          <span>終了日</span>
          <input type="date" id="to">
        </label>
        <label>
          <span>チャンネル</span>
          <select id="channel"><option value="">すべて</option></select>
        </label>
        <label class="check">
          <input type="checkbox" id="upcoming">
          <span>今後の放送のみ</span>
        </label>
        <label class="check">
          <input type="checkbox" id="politicianOnly">
          <span>政治家出演に限定</span>
        </label>
        <div class="actions">
          <button type="submit">検索</button>
          <a id="csvLink" class="ghost" href="#">CSV</a>
        </div>
      </form>
      <p class="hints">
        例:
        <button type="button" class="chip" data-q="国会">国会</button>
        <button type="button" class="chip" data-q="消費税">消費税</button>
        <button type="button" class="chip" data-q="選挙">選挙</button>
        <button type="button" class="chip" data-q="日曜討論">日曜討論</button>
        <button type="button" class="chip" data-q="報道1930">報道1930</button>
      </p>
    </section>

    <section id="panel-talents" class="panel is-hidden">
      <form id="talentForm" class="search-form">
        <label class="grow">
          <span>出演者名</span>
          <input type="search" id="talentQ" placeholder="例: 玉木 / 池上 / 大谷" autocomplete="off">
        </label>
        <label>
          <span>カテゴリ</span>
          <select id="talentTag"><option value="">名前で検索</option></select>
        </label>
        <div class="actions">
          <button type="submit">検索</button>
        </div>
      </form>
      <ul id="talentList" class="people"></ul>
    </section>

    <section id="panel-politicians" class="panel is-hidden">
      <form id="politicianForm" class="search-form">
        <label class="grow">
          <span>議員名</span>
          <input type="search" id="politicianQ" placeholder="例: 石破 / 野田 / 玉木" autocomplete="off">
        </label>
        <label class="check">
          <input type="checkbox" id="appearanceOnly">
          <span>出演の可能性が高いものだけ</span>
        </label>
        <div class="actions">
          <button type="submit">名簿を絞る</button>
        </div>
      </form>
      <ul id="politicianList" class="people"></ul>
    </section>

    <p id="status" class="status"></p>
    <h2 id="resultTitle" class="result-title is-hidden"></h2>
    <aside id="profileCard" class="profile is-hidden"></aside>
    <ul id="results" class="results"></ul>
    <div id="loadMoreWrap" class="load-more is-hidden">
      <button type="button" id="loadMoreBtn">さらに10件</button>
    </div>
  </main>

  <footer class="site-footer">
    <p>T-Clip は <a href="https://kokkai-nexus-305630672228.asia-northeast1.run.app/" target="_blank" rel="noopener">国会ネクサス</a> の姉妹アプリです。データは bangumi.org 由来の番組表（地上波7局＋BS7局）と出演リンクです。</p>
  </footer>
  <script src="/app.js?v=3"></script>
</body>
</html>
