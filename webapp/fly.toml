# T-Clip 公開検索（国会ネクサス姉妹）
app = "tv-appearance-tracker"
primary_region = "nrt"   # Tokyo

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

